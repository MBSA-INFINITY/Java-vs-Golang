server:
  port: 8080

spring:
  application:
    name: java-diskio
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: java-diskio

logging:
  level:
    root: INFO
