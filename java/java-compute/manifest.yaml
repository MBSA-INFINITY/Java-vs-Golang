apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-compute
  labels:
    app: java-compute
    lang: java
    workload: compute
    app.kubernetes.io/part-of: java-compute
    app.openshift.io/runtime: java
    hydra.verint.com/owner: "mbsaiaditya"
    hydra.verint.com/pci-compliant: "false"
    hydra.verint.com/env: "dev"
    hydra.verint.com/team: "mbsaiaditya"
    hydra.verint.com/owning-vp: "jamie.williams"
    hydra.verint.com/product-short-code: "edm"
    hydra.verint.com/production: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-compute
  template:
    metadata:
      labels:
        app: java-compute
        lang: java
        workload: compute
        hydra.verint.com/owner: "mbsaiaditya"
        hydra.verint.com/pci-compliant: "false"
        hydra.verint.com/env: "dev"
        hydra.verint.com/team: "mbsaiaditya"
        hydra.verint.com/owning-vp: "jamie.williams"
        hydra.verint.com/product-short-code: "edm"
        hydra.verint.com/production: "false"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      imagePullSecrets:
        - name: sk-quay
      containers:
        - name: java-compute
          image: quay.hydra.verint.com/mbsaiaditya/java-compute:v1
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SERVER_PORT
              value: "8080"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: java-compute
  labels:
    app: java-compute
    hydra.verint.com/owner: "mbsaiaditya"
    hydra.verint.com/pci-compliant: "false"
    hydra.verint.com/env: "dev"
    hydra.verint.com/team: "mbsaiaditya"
    hydra.verint.com/owning-vp: "jamie.williams"
    hydra.verint.com/product-short-code: "edm"
    hydra.verint.com/production: "false"
spec:
  selector:
    app: java-compute
  ports:
    - port: 8080
      targetPort: 8080
      name: http