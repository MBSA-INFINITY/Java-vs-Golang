# =============================================================================
# manifest.yaml - Java (Spring Boot, virtual threads) vs Go (goroutines)
# CPU-bound vs IO-bound benchmark stack.
#
# Contains:
#   - Namespace: bench
#   - Deployments + Services for: go-compute, go-network, java-compute, java-network
#     (identical cpu/memory requests+limits across languages for a fair comparison)
#   - Load-generator Jobs (one per target), created in a *suspended* state so they
#     don't fire the instant you apply this file. Resume one at a time - see README.md.
#
# BEFORE APPLYING: replace every "<REGISTRY>" placeholder below with your image
# registry/repo prefix (e.g. docker.io/youruser, ghcr.io/youruser, myacr.azurecr.io).
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: bench

---
# -----------------------------------------------------------------------------
# go-compute
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-compute
  namespace: bench
  labels:
    app: go-compute
    lang: go
    workload: compute
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-compute
  template:
    metadata:
      labels:
        app: go-compute
        lang: go
        workload: compute
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: go-compute
          image: <REGISTRY>/go-compute:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: GOMAXPROCS
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: go-compute
  namespace: bench
  labels:
    app: go-compute
spec:
  selector:
    app: go-compute
  ports:
    - port: 8080
      targetPort: 8080
      name: http

