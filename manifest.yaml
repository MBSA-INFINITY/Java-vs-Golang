---
# =============================================================================
# Load generator Jobs - one per target, created SUSPENDED (spec.suspend: true).
# Resume a single one at a time so results aren't skewed by concurrent tests:
#   kubectl -n bench patch job loadgen-go-compute -p "{\"spec\":{\"suspend\":false}}"
# Re-run: delete then re-apply (Jobs are immutable once started).
#   kubectl -n bench delete job loadgen-go-compute
# =============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen-go-compute
  namespace: bench
  labels: { app: loadgen, target: go-compute }
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels: { app: loadgen, target: go-compute }
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: <REGISTRY>/loadgen:latest
          env:
            - name: TARGET_URL
              value: "http://go-compute.bench.svc.cluster.local:8080/compute?limit=200000&workers=1"
            - name: CONCURRENCY_LEVELS
              value: "1,10,50,100,250,500,1000"
            - name: DURATION_SEC
              value: "20"
            - name: LABEL
              value: "go-compute"
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }

---
